{% extends 'base.html' %}

{% block title %}{{ user.username }} - 用户中心{% endblock %}

{% block content %}
    <section class="row g-4">
        <div class="col-lg-3">
            {% set active_page = 'charge' %}
            {% include '_user_sidebar.html' %}
        </div>
        <div class="col-lg-9">
            <div class="card page-card p-4">
                <h3 class="h5 mb-3">账户充值</h3>
                <p class="text-secondary">请选择充值金额</p>
                <form action="/user/charge" method="POST">
                    <div class="btn-group mb-3" role="group" id="chargeGroup">
                        <button class="btn btn-outline-danger charge-btn active" type="button" data-value="5">￥5</button>
                        <button class="btn btn-outline-danger charge-btn" type="button" data-value="10">￥10</button>
                        <button class="btn btn-outline-danger charge-btn" type="button" data-value="20">￥20</button>
                        <button class="btn btn-outline-danger charge-btn" type="button" data-value="100">￥100</button>
                    </div>
                    <input id="chargeAmount" type="hidden" name="charge_amount" value="5">
                    <div>
                        <button class="btn btn-primary" type="submit">充值</button>
                        <button class="btn btn-outline-secondary" type="reset">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
{% endblock %}

{% block extra_scripts %}
    <script>
        (function () {
            const hidden = document.getElementById('chargeAmount');
            document.querySelectorAll('.charge-btn').forEach((btn) => {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.charge-btn').forEach((x) => x.classList.remove('active'));
                    this.classList.add('active');
                    hidden.value = this.dataset.value;
                });
            });
        }());
    </script>
{% endblock %}
