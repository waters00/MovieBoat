{% extends 'base.html' %}

{% block title %}{{ user.username }} - 用户中心{% endblock %}

{% block content %}
    <section class="row g-4">
        <div class="col-lg-3">
            {% set active_page = 'change_password' %}
            {% include '_user_sidebar.html' %}
        </div>
        <div class="col-lg-9">
            <div class="card page-card p-4">
                <h3 class="h5 mb-3">修改密码</h3>
                <form action="/user/change_password" method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">请输入新密码</label>
                        <input type="password" id="password" name="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="password_repeated" class="form-label">请再次输入新密码</label>
                        <input type="password" id="password_repeated" name="password_repeated" class="form-control">
                    </div>
                    <button class="btn btn-primary" type="submit">保存</button>
                    <button class="btn btn-outline-secondary" type="reset">取消</button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
