{% extends 'base.html' %}

{% block title %}{{ user.username }} - 用户中心{% endblock %}

{% block content %}
    <section class="row g-4">
        <div class="col-lg-3">
            {% set active_page = 'profile' %}
            {% include '_user_sidebar.html' %}
        </div>
        <div class="col-lg-9">
            <div class="card page-card p-4">
                <h3 class="h5 mb-3">账户设置</h3>
                <form action="/user/profile" method="POST">
                    <div class="mb-3">
                        <img
                            src="{{ user.avatar }}"
                            data-fallback="{{ url_for('static', filename='img/avatar_placeholder.svg') }}"
                            class="avatar-md"
                            alt="{{ user.username }}">
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" id="username" name="username" value="{{ user.username }}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="phone_number" class="form-label">手机号码</label>
                        <input type="text" id="phone_number" name="phone_number" value="{{ user.phone_number }}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">余额</label>
                        <p class="fs-4 text-danger mb-0">￥{{ user.balance }}</p>
                    </div>
                    <button class="btn btn-primary" type="submit">保存</button>
                    <button class="btn btn-outline-secondary" type="reset">取消</button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
