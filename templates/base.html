<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <title>{% block title %}电影船{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block scripts %}{% endblock %}
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/">电影船 MovieBoat</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topNav">
            <div class="ms-auto d-flex gap-2 align-items-center">
                {% if user.is_authenticated %}
                    <div class="dropdown">
                        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle"></i> {{ user.username }}
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/user/profile">个人信息</a></li>
                            <li><a class="dropdown-item" href="/user/consume_history">历史记录</a></li>
                            <li><a class="dropdown-item" href="/user/charge">充值</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">退出</a></li>
                        </ul>
                    </div>
                {% else %}
                    <button class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#loginModal">登录</button>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registerModal">注册</button>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">登录账号</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="loginForm">
                <div class="modal-body">
                    <div id="loginAlert" class="alert alert-danger d-none mb-3" role="alert"></div>
                    <div class="mb-3">
                        <label for="loginPhone" class="form-label">手机号</label>
                        <input id="loginPhone" name="phone" type="text" class="form-control" placeholder="请输入手机号码" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">密码</label>
                        <input id="loginPassword" name="password" type="password" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">登录</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">注册账号</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="registerForm">
                <div class="modal-body">
                    <div id="registerAlert" class="alert alert-danger d-none mb-3" role="alert"></div>
                    <div class="mb-3">
                        <label for="registerUsername" class="form-label">用户名</label>
                        <input id="registerUsername" name="username" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="registerPhone" class="form-label">手机号</label>
                        <input id="registerPhone" name="phone" type="text" class="form-control" placeholder="请输入手机号码" required>
                    </div>
                    <div class="mb-3">
                        <label for="registerPassword" class="form-label">密码</label>
                        <input id="registerPassword" name="password" type="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="registerPasswordRepeat" class="form-label">重复密码</label>
                        <input id="registerPasswordRepeat" name="password_repeat" type="password" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">注册</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
    (function () {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginAlert = document.getElementById('loginAlert');
        const registerAlert = document.getElementById('registerAlert');
        const phoneRegex = /^1[3-9][0-9]{9}$/;

        function showAlert(el, message) {
            el.textContent = message;
            el.classList.remove('d-none');
        }

        function hideAlert(el) {
            el.textContent = '';
            el.classList.add('d-none');
        }

        async function postForm(url, data) {
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
                body: new URLSearchParams(data),
            });
            return response.json();
        }

        if (loginForm) {
            loginForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideAlert(loginAlert);
                const phone = loginForm.phone.value.trim();
                const password = loginForm.password.value;
                if (!phoneRegex.test(phone)) {
                    showAlert(loginAlert, '请输入正确的手机号码');
                    return;
                }
                if (!password) {
                    showAlert(loginAlert, '请输入密码');
                    return;
                }
                const result = await postForm('/login', {phone, password});
                if (result.code === 100) {
                    window.location.href = '/';
                    return;
                }
                showAlert(loginAlert, result.message || '登录失败');
            });
        }

        if (registerForm) {
            registerForm.addEventListener('submit', async function (event) {
                event.preventDefault();
                hideAlert(registerAlert);
                const username = registerForm.username.value.trim();
                const phone = registerForm.phone.value.trim();
                const password = registerForm.password.value;
                const repeated = registerForm.password_repeat.value;

                if (!username) {
                    showAlert(registerAlert, '请输入用户名');
                    return;
                }
                if (!phoneRegex.test(phone)) {
                    showAlert(registerAlert, '请输入正确的手机号码');
                    return;
                }
                if (password.length < 6) {
                    showAlert(registerAlert, '密码长度必须至少 6 位');
                    return;
                }
                if (password !== repeated) {
                    showAlert(registerAlert, '两次输入密码不一致');
                    return;
                }

                const result = await postForm('/register', {username, phone, password});
                if (result.code === 200) {
                    window.location.href = '/';
                    return;
                }
                showAlert(registerAlert, result.message || '注册失败');
            });
        }
    }());
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
